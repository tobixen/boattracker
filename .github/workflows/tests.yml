name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 and 3.11 both reach end of life on 2026-10-31, so the floor is 3.12.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
        with:
          # hatch-vcs derives the version from git history; a shallow clone has none.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Tests
        # Two budgets in test_parser.py measure wall clock and fail on a loaded machine by
        # design (TODO.md, "Why test_parser.py is slow").  A shared CI runner is exactly
        # that, so the budgets are not enforced here — they are a local signal.
        env:
          TRACKER_NOPERF: "1"
        run: pytest
