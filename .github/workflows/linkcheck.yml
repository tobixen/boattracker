name: Link check

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "03 22 * * *"

concurrency:
  group: linkcheck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    permissions:
      # Declaring a permissions block sets every unlisted scope to `none`, so checkout
      # needs contents:read spelling out here.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.run_id }}
          restore-keys: cache-lychee-

      - name: Check links with Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          # The same lychee as the pre-commit hook's rev, so both read lychee.toml alike.
          lycheeVersion: v0.24.2
          # Excludes and accepted status codes live in lychee.toml, which is
          # auto-discovered here and by the pre-commit hook alike.
          args: >-
            --timeout 30
            --max-retries 6
            --retry-wait-time 2
            --cache
            --max-cache-age 14d
            .

      # Issue management only on the default branch.  A PR run and a push run fire for the
      # same commit, and both creating an issue is a duplicate race; branch runs only
      # surface lychee's output in the job log.
      - name: Open or update the Link Checker issue
        if: steps.lychee.outputs.exit_code != 0 && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # gh does NOT auto-create labels; --force makes this idempotent so the very
          # first broken-link run cannot fail on a missing label.
          gh label create link-checker --color FBCA04 \
            --description "Automated link-checker report" --force
          # Canonical = oldest issue with the label in ANY state, so a recovered-then-broken
          # cycle reopens the original rather than spawning a fresh one each time.
          CANON=$(gh issue list --label link-checker --state all --json number \
            --jq '.[].number' | sort -n | head -1)
          if [ -n "$CANON" ]; then
            gh issue reopen "$CANON" || true
            gh issue edit "$CANON" --body-file ./lychee/out.md
            for n in $(gh issue list --label link-checker --state open --json number \
              --jq '.[].number' | grep -vx "$CANON" || true); do
              gh issue close "$n" --comment "Duplicate of #${CANON} - auto-closed by the link checker."
            done
          else
            gh issue create --title "Link Checker Report" \
              --body-file ./lychee/out.md --label link-checker
          fi

      - name: Close the Link Checker issue when links are healthy
        if: steps.lychee.outputs.exit_code == 0 && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --label link-checker --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "All links are now healthy."
          done
